<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Several terminals: a screen behind, and one in front with a prompt.
     Same colours as terminal.svg. -->
<svg
   viewBox="0 0 16 16"
   width="16"
   height="16"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Back screen -->
  <rect x="4.5" y="1" width="11" height="8.5" rx="1.2" ry="1.2" fill="#3b82f6" />
  <rect x="5.4" y="1.9" width="9.2" height="6.7" rx="0.4" ry="0.4" fill="#0f172a" />
  <!-- Front screen (its border hides the back screen behind it) -->
  <rect x="0.5" y="5" width="11.5" height="9" rx="1.2" ry="1.2" fill="#3b82f6" />
  <rect x="1.4" y="5.9" width="9.7" height="7.2" rx="0.4" ry="0.4" fill="#0f172a" />
  <!-- Prompt chevron > -->
  <path fill="#3b82f6" d="M 2.8,7.6 4.9,9.2 2.8,10.8 3.6,11.5 6.5,9.2 3.6,6.9 Z" />
  <!-- Cursor bar -->
  <rect x="6.6" y="10.6" width="3.2" height="1.1" rx="0.3" fill="#3b82f6" />
</svg>
